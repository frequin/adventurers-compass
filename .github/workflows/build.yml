name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      # `build` runs `check`, which runs the JUnit tests (`test`) and the
      # Fabric game tests (`runGameTest`); any failure fails the job.
      - name: Gradle build (unit tests and game tests)
        run: ./gradlew build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/run/gameTest/logs/
      - name: Remove sources JAR
        run: |
          find -type f -path './build/libs/*' -name '*sources*' -delete
      - uses: actions/upload-artifact@v4
        with:
          path: build/libs/*
